<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Média</title>

    <link rel="stylesheet" href="main.css">
</head>

<body>
    <div class="container">
        <header>
            <img src="images/logo.png" alt="Cepelo e Diploma">
            <h1>Calculadora de Média</h1>
        </header>

        <form>
            <input type="text" required placeholder="Nome da Atividade" />
            <input type="number" required placeholder="Nota da Atividade" min="0" max="10" />
            <button type="submit">Adicionar +</button>
        </form>

        <table cellspacing="0">
            <thead>
                <tr>
                    <th>Nome da Atividade</th>
                    <th>Nota</th>
                    <th>Aprovado?</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Atividade 1</td>
                    <td>7</td>
                    <td><img src="images/aprovado.png" alt="Emoji Festejando de Alegria"></td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td>Media Final</td>
                    <td>7</td>
                    <td><span class="resultado aprovado">Aprovado</span></td>
                </tr>
            </tfoot>
        </table>
    </div>
</body>

</html>
